<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉLORIA — Seller Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #faf7f5;
    color: #2f2926;
}

header {
    background: white;
    border-bottom: 1px solid #eee;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    letter-spacing: 4px;
    font-weight: bold;
}

.admin-label {
    font-size: 13px;
    color: #777;
}

.container {
    display: flex;
    min-height: calc(100vh - 70px);
}

/* Sidebar */

.sidebar {
    width: 230px;
    background: white;
    border-right: 1px solid #eee;
    padding: 25px 15px;
}

.sidebar h3 {
    margin: 0 0 25px;
    font-size: 14px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.menu {
    display: block;
    width: 100%;
    border: none;
    background: none;
    text-align: left;
    padding: 14px;
    margin-bottom: 6px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.menu:hover {
    background: #f5efec;
}

/* Main */

.main {
    flex: 1;
    padding: 30px;
}

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-title h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 500;
}

.add-btn {
    background: #2f2926;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.add-btn:hover {
    opacity: .85;
}

/* Cards */

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 35px;
}

.card {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 22px;
}

.card-title {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.card-number {
    font-size: 28px;
    font-weight: bold;
}

/* Product form */

.form-box {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 25px;
    max-width: 800px;
}

.form-box h2 {
    margin-top: 0;
    font-size: 21px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.checks {
    display: flex;
    gap: 25px;
    margin: 10px 0 20px;
}

.checks label {
    font-size: 14px;
}

.save-btn {
    background: #2f2926;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 6px;
    cursor: pointer;
}

/* Mobile */

@media (max-width: 750px) {

    .container {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #eee;
        padding: 12px;
    }

    .sidebar h3 {
        display: none;
    }

    .menu {
        display: inline-block;
        width: auto;
        margin-right: 4px;
        padding: 10px;
    }

    .main {
        padding: 20px 15px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .page-title {
        gap: 15px;
        align-items: flex-start;
    }

    .page-title h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">ÉLORIA</div>
    <div class="admin-label">SELLER DASHBOARD</div>
</header>

<div class="container">

    <aside class="sidebar">

        <h3>Management</h3>

        <button class="menu">📊 Dashboard</button>
        <button class="menu">🛍️ Products</button>
        <button class="menu">➕ Add Product</button>
        <button class="menu">📦 Orders</button>
        <button class="menu">👥 Customers</button>
        <button class="menu">⚙️ Settings</button>

    </aside>

    <main class="main">

        <div class="page-title">
            <h1>Products</h1>

            <button class="add-btn">
                + Add Product
            </button>
        </div>

        <div class="cards">

            <div class="card">
                <div class="card-title">TOTAL PRODUCTS</div>
                <div class="card-number">0</div>
            </div>

            <div class="card">
                <div class="card-title">NEW PRODUCTS</div>
                <div class="card-number">0</div>
            </div>

            <div class="card">
                <div class="card-title">SALE PRODUCTS</div>
                <div class="card-number">0</div>
            </div>

        </div>

        <div class="form-box">

            <h2>Add New Product</h2>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" placeholder="Example: Silk Midi Dress">
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Price (€)</label>
                    <input type="number" placeholder="79.00">
                </div>

                <div class="form-group">
                    <label>Old Price (€)</label>
                    <input type="number" placeholder="99.00">
                </div>

            </div>

            <div class="form-group">
                <label>Category</label>

                <select>
                    <option>Dresses</option>
                    <option>Tops</option>
                    <option>Bottoms</option>
                    <option>Accessories</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Description</label>

                <textarea placeholder="Write product description..."></textarea>
            </div>

            <div class="form-group">
                <label>Product Images</label>

                <input type="text"
                       placeholder="Image URL 1">

                <br><br>

                <input type="text"
                       placeholder="Image URL 2">
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" placeholder="10">
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select>
                        <option>Available</option>
                        <option>Out of Stock</option>
                    </select>
                </div>

            </div>

            <div class="checks">

                <label>
                    <input type="checkbox">
                    NEW
                </label>

                <label>
                    <input type="checkbox">
                    SALE
                </label>

            </div>

            <button class="save-btn">
                Save Product
            </button>

        </div>

    </main>

</div>

</body>
  </html>
