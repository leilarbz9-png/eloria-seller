<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ÉLORIA — Seller Dashboard</title>

<style>

*{
    box-sizing:border-box
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#faf7f5;
    color:#2f2926
}

header{
    background:white;
    border-bottom:1px solid #eee;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.logo{
    font-size:25px;
    letter-spacing:4px;
    font-weight:bold
}

.admin-label{
    font-size:13px;
    color:#777
}

.container{
    display:flex;
    min-height:calc(100vh - 70px)
}

.sidebar{
    width:230px;
    background:white;
    border-right:1px solid #eee;
    padding:25px 15px
}

.sidebar h3{
    margin:0 0 25px;
    font-size:14px;
    color:#999;
    text-transform:uppercase;
    letter-spacing:1px
}

.menu{
    display:block;
    width:100%;
    border:none;
    background:none;
    text-align:left;
    padding:14px;
    margin-bottom:6px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer
}

.menu:hover{
    background:#f5efec
}

.main{
    flex:1;
    padding:30px
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px
}

.page-title h1{
    margin:0;
    font-size:28px;
    font-weight:500
}

.add-btn{
    background:#2f2926;
    color:white;
    border:none;
    padding:13px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:35px
}

.card{
    background:white;
    border:1px solid #eee;
    border-radius:10px;
    padding:22px
}

.card-title{
    color:#888;
    font-size:13px;
    margin-bottom:10px
}

.card-number{
    font-size:28px;
    font-weight:bold
}

.form-box{
    background:white;
    border:1px solid #eee;
    border-radius:10px;
    padding:25px;
    max-width:900px;
    margin-bottom:30px
}

.form-box h2{
    margin-top:0;
    font-size:21px
}

.form-group{
    margin-bottom:18px
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:14px;
    outline:none
}

.form-group textarea{
    min-height:100px;
    resize:vertical
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px
}

.checks{
    display:flex;
    gap:25px;
    margin:10px 0 20px
}

.checks label{
    font-size:14px
}

.save-btn{
    background:#2f2926;
    color:white;
    border:none;
    padding:13px 25px;
    border-radius:6px;
    cursor:pointer
}

.save-btn:disabled{
    opacity:.6
}

.message{
    margin-top:15px;
    font-size:14px;
    font-weight:bold
}


/* =========================
   IMAGE UPLOAD
========================= */

.image-upload{
    border:1px dashed #ccc;
    border-radius:8px;
    padding:15px;
    background:#fafafa;
    margin-bottom:15px
}

.image-upload input[type="file"]{
    padding:10px;
    background:white;
    cursor:pointer
}

.preview{
    display:none;
    width:130px;
    height:160px;
    object-fit:cover;
    border-radius:7px;
    margin-top:12px;
    border:1px solid #ddd
}


/* =========================
   COLLECTIONS
========================= */

.collection-products{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    max-height:350px;
    overflow-y:auto;
    background:#fafafa
}

.product-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    background:white;
    border-bottom:1px solid #eee
}

.product-option:last-child{
    border-bottom:none
}

.product-option input{
    width:18px;
    height:18px
}

.product-option img{
    width:55px;
    height:65px;
    object-fit:cover;
    border-radius:5px
}

.product-info{
    flex:1
}

.product-name{
    font-weight:bold;
    font-size:14px
}

.product-price{
    color:#777;
    font-size:13px;
    margin-top:4px
}

.empty-products{
    padding:20px;
    text-align:center;
    color:#888
}

.collection-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px
}

.collection-card{
    background:white;
    border:1px solid #eee;
    border-radius:10px;
    padding:15px
}

.collection-card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:7px;
    margin-bottom:12px
}

.collection-card h3{
    margin:0 0 7px;
    font-size:18px
}

.collection-card p{
    color:#777;
    font-size:13px;
    margin:0 0 10px
}


@media(max-width:750px){

    .container{
        display:block
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:1px solid #eee;
        padding:12px;
        overflow-x:auto;
        white-space:nowrap
    }

    .sidebar h3{
        display:none
    }

    .menu{
        display:inline-block;
        width:auto;
        margin-right:4px;
        padding:10px
    }

    .main{
        padding:20px 15px
    }

    .cards{
        grid-template-columns:1fr
    }

    .row{
        grid-template-columns:1fr
    }

    .page-title{
        gap:15px;
        align-items:flex-start
    }

    .page-title h1{
        font-size:23px
    }

    .collection-list{
        grid-template-columns:1fr
    }

}

</style>

</head>

<script>


const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzAYBy46FwQm_znbR7wzPb9rtzj6phhQXDJPTNX3dCDDc0kysevoo9ksiQEgjBqpi2Qjw/exec";


let products = [];

let collections = [];


/* =========================
   IMAGE READER
========================= */

function readFileAsDataURL(file){

    return new Promise((resolve,reject)=>{

        if(!file){
            resolve("");
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            () => resolve(reader.result);

        reader.onerror =
            () => reject(
                new Error(
                    "Could not read image"
                )
            );

        reader.readAsDataURL(file);

    });

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file){

    return new Promise((resolve,reject)=>{

        if(!file){
            resolve("");
            return;
        }

        const reader =
            new FileReader();

        reader.onload = function(e){

            const img =
                new Image();

            img.onload = function(){

                const maxWidth = 1400;
                const maxHeight = 1800;

                let width =
                    img.width;

                let height =
                    img.height;


                if(
                    width > maxWidth ||
                    height > maxHeight
                ){

                    const ratio =
                        Math.min(
                            maxWidth / width,
                            maxHeight / height
                        );

                    width =
                        Math.round(
                            width * ratio
                        );

                    height =
                        Math.round(
                            height * ratio
                        );

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        0.82
                    )
                );

            };


            img.onerror =
                () => reject(
                    new Error(
                        "Invalid image"
                    )
                );


            img.src =
                e.target.result;

        };


        reader.onerror =
            () => reject(
                new Error(
                    "Could not read image"
                )
            );


        reader.readAsDataURL(file);

    });

}


/* =========================
   PREVIEW
========================= */

function previewImage(input, previewId){

    const file =
        input.files[0];

    const preview =
        document.getElementById(
            previewId
        );

    if(!file){

        preview.style.display =
            "none";

        preview.src = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            preview.src =
                e.target.result;

            preview.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


/* =========================
   PRODUCT JSONP
========================= */

function loadProducts(){

    const callbackName =
        "productsCallback_" +
        Date.now();


    window[callbackName] =
        function(data){

            products =
                Array.isArray(data)
                    ? data
                    : [];


            updateProductStats();

            renderProductSelection();


            delete window[callbackName];

            script.remove();

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        SCRIPT_URL +
        "?callback=" +
        callbackName +
        "&t=" +
        Date.now();


    document.body.appendChild(
        script
    );

}


/* =========================
   COLLECTION JSONP
========================= */

function loadCollections(){

    const callbackName =
        "collectionsCallback_" +
        Date.now();


    window[callbackName] =
        function(data){

            collections =
                Array.isArray(data)
                    ? data
                    : [];


            renderCollections();


            delete window[callbackName];

            script.remove();

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        SCRIPT_URL +
        "?type=collections" +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


    document.body.appendChild(
        script
    );

}


/* =========================
   STATS
========================= */

function isTrue(value){

    return value === true ||
           value === "true" ||
           value === "TRUE" ||
           value === 1 ||
           value === "1";

}


function updateProductStats(){

    document.getElementById(
        "totalProducts"
    ).textContent =
        products.length;


    document.getElementById(
        "newProducts"
    ).textContent =
        products.filter(
            p =>
                isTrue(
                    p["New"] ||
                    p.newProduct
                )
        ).length;


    document.getElementById(
        "saleProducts"
    ).textContent =
        products.filter(
            p =>
                isTrue(
                    p["Sale"] ||
                    p.sale
                )
        ).length;

}


/* =========================
   PRODUCT SELECTION
========================= */

function renderProductSelection(){

    const box =
        document.getElementById(
            "productSelection"
        );


    if(!products.length){

        box.innerHTML =
            '<div class="empty-products">No products found.</div>';

        return;

    }


    box.innerHTML = "";


    products.forEach(product => {

        const id =
            product["ID"] ||
            product.id ||
            "";


        const name =
            product["Product Name"] ||
            product.name ||
            "Product";


        const price =
            product["Price"] ||
            product.price ||
            "";


        const image =
            product["Image 1"] ||
            product.image1 ||
            "";


        const item =
            document.createElement(
                "label"
            );


        item.className =
            "product-option";


        item.innerHTML = `

            <input
                type="checkbox"
                class="collection-product"
                value="${escapeHTML(String(id))}">

            ${
                image
                ? `<img src="${image}" alt="">`
                : ""
            }

            <div class="product-info">

                <div class="product-name">
                    ${escapeHTML(name)}
                </div>

                <div class="product-price">
                    ${escapeHTML(String(price))} €
                </div>

            </div>
        `;


        box.appendChild(item);

    });

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

    const button =
        document.getElementById(
            "saveButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const price =
        document.getElementById(
            "price"
        ).value;


    const stock =
        document.getElementById(
            "stock"
        ).value;


    if(
        !name ||
        !price ||
        !stock
    ){

        message.textContent =
            "Please fill in Product Name, Price and Stock.";

        return;

    }


    const file1 =
        document.getElementById(
            "image1File"
        ).files[0];


    const file2 =
        document.getElementById(
            "image2File"
        ).files[0];


    button.disabled = true;

    button.textContent =
        "Uploading...";

    message.textContent =
        "";


    try{

        const image1 =
            await compressImage(
                file1
            );


        const image2 =
            await compressImage(
                file2
            );


        const product = {

            id:Date.now(),

            name:name,

            price:price,

            oldPrice:
                document.getElementById(
                    "oldPrice"
                ).value,

            category:
                document.getElementById(
                    "category"
                ).value,

            description:
                document.getElementById(
                    "description"
                ).value,

            image1:image1,

            image2:image2,

            stock:stock,

            status:
                document.getElementById(
                    "status"
                ).value,

            newProduct:
                document.getElementById(
                    "newProduct"
                ).checked,

            sale:
                document.getElementById(
                    "sale"
                ).checked

        };


        button.textContent =
            "Saving...";


        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",
                    body:JSON.stringify(
                        product
                    )
                }
            );


        const result =
            await response.text();


        if(
            result.trim() ===
            "SUCCESS"
        ){

            message.textContent =
                "Product saved successfully!";


            clearProductForm();

            loadProducts();

        }else{

            message.textContent =
                result ||
                "An unknown error occurred.";

        }


    }catch(error){

        message.textContent =
            "Error: " +
            error.message;

    }


    button.disabled = false;

    button.textContent =
        "Save Product";

}


/* =========================
   SAVE COLLECTION
========================= */

async function saveCollection(){

    const button =
        document.getElementById(
            "saveCollectionButton"
        );


    const message =
        document.getElementById(
            "collectionMessage"
        );


    const name =
        document.getElementById(
            "collectionName"
        ).value.trim();


    if(!name){

        message.textContent =
            "Please enter a collection name.";

        return;

    }


    const selectedProducts =
        Array.from(
            document.querySelectorAll(
                ".collection-product:checked"
            )
        ).map(
            input => input.value
        );


    const file1 =
        document.getElementById(
            "collectionImage1File"
        ).files[0];


    const file2 =
        document.getElementById(
            "collectionImage2File"
        ).files[0];


    button.disabled = true;

    button.textContent =
        "Uploading...";

    message.textContent =
        "";


    try{

        const image1 =
            await compressImage(
                file1
            );


        const image2 =
            await compressImage(
                file2
            );


        const collection = {

            type:"collection",

            id:Date.now(),

            name:name,

            description:
                document.getElementById(
                    "collectionDescription"
                ).value,

            image1:image1,

            image2:image2,

            productIds:
                selectedProducts.join(",")

        };


        button.textContent =
            "Saving...";


        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",
                    body:JSON.stringify(
                        collection
                    )
                }
            );


        const result =
            await response.text();


        if(
            result.trim() ===
            "SUCCESS"
        ){

            message.textContent =
                "Collection saved successfully!";


            clearCollectionForm();

            loadCollections();

        }else{

            message.textContent =
                result ||
                "An unknown error occurred.";

        }


    }catch(error){

        message.textContent =
            "Error: " +
            error.message;

    }


    button.disabled = false;

    button.textContent =
        "Save Collection";

}


/* =========================
   COLLECTION DISPLAY
========================= */

function renderCollections(){

    const box =
        document.getElementById(
            "collectionList"
        );


    if(!collections.length){

        box.innerHTML =
            '<div class="empty-products">No collections yet.</div>';

        return;

    }


    box.innerHTML = "";


    collections.forEach(
        collection => {

            const name =
                collection[
                    "Collection Name"
                ] ||
                collection.name ||
                "Collection";


            const description =
                collection[
                    "Description"
                ] ||
                collection.description ||
                "";


            const image =
                collection[
                    "Image 1"
                ] ||
                collection.image1 ||
                "";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "collection-card";


            card.innerHTML = `

                ${
                    image
                    ? `<img src="${image}" alt="">`
                    : ""
                }

                <h3>
                    ${escapeHTML(name)}
                </h3>

                <p>
                    ${escapeHTML(description)}
                </p>

            `;


            box.appendChild(card);

        }
    );

}

/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
